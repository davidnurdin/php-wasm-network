# Serveur du multijoueur en ligne de Sonic PHP (https://davidnurdin.github.io/php-wasm-sdl/) :
#   relay  : salons / relais / signalisation WebRTC (php-wasm-network, PHP pur)      -> wss://${DOMAIN}/ws
#   caddy  : TLS (certificat Let's Encrypt de ${DOMAIN}) devant le relay et le site ; Traefik lui passe le TLS
#            tel quel (routeur TCP HostSNI + passthrough) et le port 80 (challenge ACME) : la config Traefik n'est
#            pas touchée. ${DOMAIN} peut passer par le proxy Cloudflare (l'adresse du visiteur : CF-Connecting-IP)
#   coturn : STUN / TURN pour WebRTC derrière les NAT stricts (identifiants temporaires donnés par le relay)
#            ports à part de celui de chat.mimichat.fr : 3480 (udp/tcp), relais 49300-49340/udp
#   site   : le site https://${DOMAIN}/ (Symfony + FrankenPHP, sonicGameSite) : inscription, bouton JOUER, hub
#            Mercure des visiteurs en direct ; derrière caddy
#   db     : MariaDB du site (réseau à part, seul le site y accède)
#
#   docker compose up -d --build        (./update.sh : nouvelle version de php-wasm-network ;
#                                        ./update-site.sh : nouvelle version du site)
name: sonicgameserverphp

networks:
  web:
    name: traefik_web
    external: true
  internal:
  sitedb:

volumes:
  caddy_data:
  caddy_config:
  site_db:
  site_data:

services:
  relay:
    build:
      context: ./php-wasm-network
      dockerfile: server/Dockerfile
    restart: unless-stopped
    environment:
      TURN_SECRET: ${TURN_SECRET}
      # TURN_HOST : un nom qui mène directement à la machine (pas par le proxy Cloudflare, qui ne passe que le web)
      TURN_URLS: turn:${TURN_HOST}:${TURN_PORT}?transport=udp,turn:${TURN_HOST}:${TURN_PORT}?transport=tcp
      STUN_URLS: stun:${TURN_HOST}:${TURN_PORT}
    networks:
      - internal
    logging:
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      DOMAIN_ALIAS: ${DOMAIN_ALIAS}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - internal
      - web
    depends_on:
      - relay
      - site
    logging:
      options: { max-size: "10m", max-file: "3" }
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik_web
      # port 80 : challenge ACME de Caddy (et redirection vers https)
      - traefik.http.routers.sonicnet-http.rule=Host(`${DOMAIN}`,`${DOMAIN_ALIAS}`)
      - traefik.http.routers.sonicnet-http.entrypoints=insecure
      - traefik.http.routers.sonicnet-http.service=sonicnet-http
      - traefik.http.services.sonicnet-http.loadbalancer.server.port=80
      # port 443 : le TLS de ${DOMAIN} passe tel quel jusqu'à Caddy
      - traefik.tcp.routers.sonicnet-tls.rule=HostSNI(`${DOMAIN}`,`${DOMAIN_ALIAS}`)
      - traefik.tcp.routers.sonicnet-tls.entrypoints=secure
      - traefik.tcp.routers.sonicnet-tls.tls.passthrough=true
      - traefik.tcp.routers.sonicnet-tls.service=sonicnet-tls
      - traefik.tcp.services.sonicnet-tls.loadbalancer.server.port=443

  site:
    build: ./sonicGameSite
    restart: unless-stopped
    environment:
      APP_SECRET: ${SITE_APP_SECRET}
      DATABASE_URL: mysql://sonic:${SITE_DB_PASSWORD}@db:3306/sonic?serverVersion=11.4.13-MariaDB&charset=utf8mb4
      GAME_URL: https://davidnurdin.github.io/php-wasm-sdl/
      RELAY_HEALTH_URL: http://relay:8090/health
      # seul caddy (réseau interne) parle au site : il donne l'adresse du visiteur dans X-Forwarded-For
      TRUSTED_PROXIES: PRIVATE_SUBNETS
      MERCURE_URL: http://localhost:8080/.well-known/mercure
      MERCURE_PUBLIC_URL: https://${DOMAIN}/.well-known/mercure
      MERCURE_COOKIE_NAME: __Secure-mercure_access_token
      MERCURE_JWT_SECRET: ${SITE_MERCURE_SECRET}
      MERCURE_JWT_ISSUER: https://${DOMAIN}
    volumes:
      - site_data:/data
    networks:
      - internal
      - sitedb
    depends_on:
      db:
        condition: service_healthy
    logging:
      options: { max-size: "10m", max-file: "3" }

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: sonic
      MARIADB_USER: sonic
      MARIADB_PASSWORD: ${SITE_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SITE_DB_ROOT_PASSWORD}
      MARIADB_AUTO_UPGRADE: "1"
    # petite base : peu de mémoire
    command: --innodb-buffer-pool-size=64M --max-connections=40 --performance-schema=OFF
    volumes:
      - site_db:/var/lib/mysql
    networks:
      - sitedb
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      options: { max-size: "10m", max-file: "3" }

  coturn:
    image: coturn/coturn:4.6.2
    restart: unless-stopped
    network_mode: host
    # relais vers les adresses privées interdit : un client TURN ne peut pas atteindre les services du VPS
    command: >
      -n --log-file=stdout --no-cli --fingerprint --no-multicast-peers
      --listening-ip=${PRIVATE_IP} --relay-ip=${PRIVATE_IP} --external-ip=${PUBLIC_IP}/${PRIVATE_IP}
      --listening-port=${TURN_PORT} --min-port=${TURN_MIN_PORT} --max-port=${TURN_MAX_PORT}
      --no-tls --no-dtls
      --realm=${DOMAIN} --use-auth-secret --static-auth-secret=${TURN_SECRET}
      --total-quota=100 --user-quota=12 --max-bps=2000000
      --denied-peer-ip=0.0.0.0-0.255.255.255 --denied-peer-ip=10.0.0.0-10.255.255.255
      --denied-peer-ip=100.64.0.0-100.127.255.255 --denied-peer-ip=127.0.0.0-127.255.255.255
      --denied-peer-ip=169.254.0.0-169.254.255.255 --denied-peer-ip=172.16.0.0-172.31.255.255
      --denied-peer-ip=192.168.0.0-192.168.255.255
    logging:
      options: { max-size: "10m", max-file: "3" }
